<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKAI Soluções - Entregas</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial;

  background-image: url('bg.jpeg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 20px;
  position: relative;
}

/* overlay */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 0;
}

/* ===== HEADER DA MARCA ===== */
.header {
  position: relative;
  z-index: 1;
  text-align: center;
  color: white;
  margin-bottom: 15px;
  animation: fadeIn 0.6s ease;
}

.brand {
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 1px;
}

.tagline {
  font-size: 14px;
  opacity: 0.9;
  margin-top: 3px;
}

.location {
  font-size: 13px;
  margin-top: 5px;
  opacity: 0.8;
}

@keyframes fadeIn {
  from {opacity: 0; transform: translateY(-10px);}
  to {opacity: 1; transform: translateY(0);}
}

/* CARD */
.card {
  background: rgba(255,255,255,0.97);
  width: 100%;
  max-width: 420px;
  padding: 22px;
  border-radius: 18px;
  text-align: center;
  position: relative;
  z-index: 1;
}

.icon {
  font-size: 42px;
  color: #0f9b0f;
  margin-bottom: 10px;
}

h2 {
  margin: 5px 0;
}

input {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border-radius: 12px;
  border: 1px solid #ddd;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: none;
  border-radius: 14px;
  background: #0f9b0f;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

/* LOADING */
.loading {
  display: none;
  margin-top: 15px;
}

.spinner {
  width: 34px;
  height: 34px;
  border: 4px solid #eee;
  border-top: 4px solid #0f9b0f;
  border-radius: 50%;
  margin: 10px auto;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  justify-content: center;
  align-items: center;
  padding: 20px;
  z-index: 999;
}

.modal-box {
  background: white;
  width: 100%;
  max-width: 320px;
  padding: 24px;
  border-radius: 18px;
  text-align: center;
}

.modal-box i {
  font-size: 42px;
  color: #0f9b0f;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<!-- ===== HEADER MARCA ===== -->
<div class="header">
  <div class="brand">AKAI SOLUÇÕES</div>
  <div class="tagline">Prestação de Serviços e Entregas</div>
  <div class="location">📍 Cacuaco • Kikolo</div>
</div>

<div class="card">

  <div class="icon">
    <i class="fa-solid fa-location-dot"></i>
  </div>

  <h2>Enviar Localização</h2>

  <input id="ref" placeholder="Ex: casa azul, portão preto, igreja...">

  <button onclick="openModal()">
    Enviar localização
  </button>

  <div class="loading" id="loading">
    <p>📡 A obter localização...</p>
    <div class="spinner"></div>
  </div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">
    <i class="fa-solid fa-location-dot"></i>
    <h3>Permitir localização</h3>
    <p>Precisamos da tua localização para entrega correta.</p>
    <button onclick="getGPS()">Continuar</button>
  </div>
</div>

<script>

function openModal() {
  document.getElementById("modal").style.display = "flex";
}

function getGPS() {

  document.getElementById("modal").style.display = "none";

  let ref = document.getElementById("ref").value;

  if (!navigator.geolocation) {
    alert("GPS não suportado");
    return;
  }

  document.getElementById("loading").style.display = "block";

  navigator.geolocation.getCurrentPosition(

    function(pos) {

      let lat = pos.coords.latitude;
      let lon = pos.coords.longitude;

      let msg =
`📍 Aqui está a minha localização:
https://www.google.com/maps?q=${lat},${lon}

🏠 Referência:
${ref}`;

      let numero = "244931115654";

      let isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      let url;

      if (isMobile) {
        url =
        "whatsapp://send?phone=" + numero +
        "&text=" + encodeURIComponent(msg);
      } else {
        url =
        "https://api.whatsapp.com/send?phone=" + numero +
        "&text=" + encodeURIComponent(msg);
      }

      setTimeout(() => {
        window.location.href = url;
      }, 300);

      document.getElementById("loading").style.display = "none";

    },

    function() {
      document.getElementById("loading").style.display = "none";
      alert("Permita a localização para continuar");
    }

  );

}

</script>

</body>
</html>
